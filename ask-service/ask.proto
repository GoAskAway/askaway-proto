syntax = "proto3";
package ask;

// Service definition
service AskService {
  // Submit a prompt and get a reply
  rpc Prompt(UsrPromptRequest) returns (AssistantReply);
  // Prepare an attachment upload stream
  rpc PrepareAttachmentUpload(PrepareAttachmentUploadRequest) returns (PrepareAttachmentUploadResponse);
  // Continue response streams from client-reported cursors.
  rpc ContinuePromptResultStreams(ContinuePromptResultStreamsRequest) returns (ContinuePromptResultStreamsResponse);
  // Cancel a prompt and release server-side result state.
  rpc CancelPrompt(CancelPromptRequest) returns (CancelPromptResponse);
  // Submit the answer to an AskLocalService.AskUserQuestion previously raised by the
  // server while handling a prompt. Wakes the suspended server-side process by ask_id.
  rpc SubmitUserQuestionAnswer(AskUserQuestionAnswer) returns (SubmitUserQuestionAnswerAck);
}

// Prompt and reply message definitions
message UsrPromptRequest {
  string question_id = 1; // Unique question identifier
  string session_id = 2; // Session ID for tracking
  string text = 3; // Text question (if applicable)
  string voice_stream_id = 4; // Voice question stream ID (if applicable)
  Location location = 5; // Optional location context
  repeated string attachment_ids = 6; // Optional attachment IDs
  string text_response_stream_id = 7; // Text response stream ID (if applicable)
  string voice_response_stream_id = 8; // Voice response stream ID (if applicable)
  string device_installation_id = 9; // Stable app installation ID for push notification routing
}

enum PromptReplyStatus {
  PROMPT_REPLY_STATUS_UNKNOWN = 0;
  PROMPT_REPLY_IMMEDIATE_RESULT = 1; // Result is already included in AssistantReply.text
  PROMPT_REPLY_PROCESSING_STREAM = 2; // Result will be returned through response streams
  PROMPT_REPLY_EXCEPTION = 3; // Prompt failed; exception_message is populated
}

message AssistantReply {
  string question_id = 1; // ID for the answer stream
  string session_id = 2; // Session ID for tracking
  string text = 3; // Complete text result only when status is PROMPT_REPLY_IMMEDIATE_RESULT
  PromptReplyStatus status = 4;
  string exception_message = 5;
}

message ContinuePromptResultStreamsRequest {
  string question_id = 1;
  string session_id = 2;
  repeated StreamPayloadCursor streams = 3;
}

message StreamPayloadCursor {
  string stream_id = 1;
  uint64 next_payload_id = 2; // Next payload ID the client expects on this stream, initially 0
}

message ContinuePromptResultStreamsResponse {
  string question_id = 1;
  string session_id = 2;
  string exception_message = 3;
}

message CancelPromptRequest {
  string question_id = 1;
  string session_id = 2;
}

message CancelPromptResponse {
  string question_id = 1;
  string session_id = 2;
  string exception_message = 3;
}

message PromptResponseStreamPayload {
  string protocol = 1; // "prompt-result.v1"
  string question_id = 2;
  string session_id = 3;
  uint64 payload_id = 4; // Same as DataStream.sequence within the same stream
  bool eos = 5; // true means this response stream is finished
  bytes payload = 6; // Askaway upper-layer encoded payload bytes
}

// Predefined attachment types
enum AttachmentType {
  ATTACHMENT_TYPE_UNKNOWN = 0;
  IMAGE = 1;
  DOCUMENT = 2;
  AUDIO = 3;
  VIDEO = 4;
  OTHER = 99;
}

// Attachment upload final status
enum AttachmentUploadStatus {
  ATTACHMENT_UPLOAD_STATUS_UNKNOWN = 0;
  COMPLETED = 1;
  FAILED = 2;
}

// Attachment upload preparation request
message PrepareAttachmentUploadRequest {
  string id = 1; // Attachment unique identifier
  string filename = 2; // Original filename
  AttachmentType type = 3; // Attachment type
  string stream_id = 4; // DataStream ID used to upload file chunks
  string checksum = 5; // Checksum of the original file bytes
  string checksum_algorithm = 6; // Checksum algorithm, for example "md5" or "sha256"
  uint64 size_bytes = 7; // Original file size in bytes
  string result_stream_id = 8; // Client-registered stream for upload result
}

// Attachment upload preparation response
message PrepareAttachmentUploadResponse {
  string id = 1; // Attachment ID (matches request id)
  int32 status_code = 2; // Status code (0 means stream handler registered)
  string error_message = 3; // Error message (if any)
}

// Attachment upload final result sent through result_stream_id
message AttachmentUploadResult {
  string id = 1; // Attachment ID (matches request id)
  AttachmentUploadStatus status = 2; // Final upload status
  int32 status_code = 3; // Status code (0 means completed)
  string error_message = 4; // Error message (if any)
}

// Shared location type
message Location {
  double latitude = 1; // Latitude
  double longitude = 2; // Longitude
  string address = 3; // Optional: Address description
  string place_name = 4; // Optional: Place name
}

// Answer submitted by the client for an AskUserQuestion raised by the server.
message AskUserQuestionAnswer {
  string ask_id = 1; // Matches the ask_id from AskUserQuestionRequest
  bool cancelled = 2; // true if the user dismissed without answering
  repeated QuestionAnswer answers = 3; // One per answered question
}

message QuestionAnswer {
  uint32 question_index = 1; // Index into the questions list
  repeated uint32 selected_options = 2; // Selected option indices (multiple when multi_select)
  string custom_text = 3; // Free-text "Other" answer, if any
}

message SubmitUserQuestionAnswerAck {
  bool accepted = 1; // true if ask_id matched and was still pending; false if unknown/expired/already answered
}
