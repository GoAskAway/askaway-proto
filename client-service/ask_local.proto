syntax = "proto3";

package client;

// AskLocalService is the local actor that fronts the Shell/UI. Besides forwarding
// Shell requests to the remote AskService, it exposes capabilities that AskService
// reverse-calls while handling an in-flight request.
service AskLocalService {
  // Raise a structured question to the user while AskService is handling a prompt.
  // Returns immediately after delivering the question; the answer is submitted back
  // via AskService.SubmitUserQuestionAnswer, so the caller does not block on this RPC.
  rpc AskUserQuestion(AskUserQuestionRequest) returns (AskUserQuestionAck);
}

message AskUserQuestionRequest {
  string ask_id = 1; // Unique id for this ask
  string session_id = 2; // Session ID, for routing to the right session
  string prompt_question_id = 3; // question_id of the in-flight prompt that triggered this ask (optional)
  repeated Question questions = 4; // Questions to ask
}

message Question {
  string header = 1; // Short chip-style label
  string question = 2; // Full question text
  bool multi_select = 3; // Allow selecting multiple options
  repeated QuestionOption options = 4; // Predefined options
}

message QuestionOption {
  string label = 1; // Option display text
  string description = 2; // Optional: option explanation
}

message AskUserQuestionAck {
  string ask_id = 1; // Confirms the question was received
}
